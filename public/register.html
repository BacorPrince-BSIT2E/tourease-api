<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#126b68">
    <title>Register | TourEase</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-visual" aria-label="Welcome to TourEase">
        <a class="auth-brand" href="/index.html" aria-label="TourEase home"><span aria-hidden="true">✈️</span> TourEase</a>
        <div class="auth-welcome">
          <p class="auth-eyebrow">Your next story starts here</p>
          <h1>Make room for a new adventure</h1>
          <p>Plan your trip, find guides and stays, all in one place.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="auth-eyebrow">Join the journey</p>
          <h2 id="auth-title">Create your account</h2>
          <p class="auth-intro">Start planning your next Tagaytay getaway.</p>
          <div id="auth-message" class="auth-message" role="alert" hidden></div>
          <form id="register-form" novalidate>
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text" autocomplete="name" maxlength="100" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <label class="auth-toggle"><input id="show-password" type="checkbox"> Show passwords</label>

            <button id="auth-submit" class="button button-primary auth-submit" type="submit">Create account</button>
          </form>
          <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
          <a class="auth-back" href="/index.html">Back to home</a>
        </div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#126b68">
    <title>Log in | TourEase</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-visual" aria-label="Welcome to TourEase">
        <a class="auth-brand" href="/index.html" aria-label="TourEase home"><span aria-hidden="true">✈️</span> TourEase</a>
        <div class="auth-welcome">
          <p class="auth-eyebrow">Your next story starts here</p>
          <h1>Welcome back, traveler</h1>
          <p>Plan your trip, find guides and stays, all in one place.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="auth-eyebrow">Welcome back</p>
          <h2 id="auth-title">Log in to TourEase</h2>
          <p class="auth-intro">Pick up where your next adventure begins.</p>
          <div id="auth-message" class="auth-message" role="alert" hidden></div>
          <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <label class="auth-toggle"><input id="show-password" type="checkbox"> Show password</label>

            <button id="auth-submit" class="button button-primary auth-submit" type="submit">Log in</button>
          </form>
          <p class="auth-switch">No account yet? <a href="/register.html">Register</a></p>
          <a class="auth-back" href="/index.html">Back to home</a>
        </div>
      </section>
    </main>
  </body>
</html>
